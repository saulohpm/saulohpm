<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1000" height="670" viewBox="0 0 1000 670" role="img" aria-labelledby="title desc">
  <title id="title">Saulo — terminal profile</title>
  <desc id="desc">A macOS-inspired dark terminal showing Saulo's background, interests, education, and technology stack.</desc>

  <defs>
    <linearGradient id="windowBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#111820"/>
      <stop offset="1" stop-color="#0b1016"/>
    </linearGradient>
    <linearGradient id="titleBar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#252b33"/>
      <stop offset="1" stop-color="#1b222b"/>
    </linearGradient>
    <clipPath id="windowClip">
      <rect x="1" y="1" width="998" height="668" rx="15"/>
    </clipPath>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="12"/>
      <feOffset dy="7"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.28"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Window -->
  <g filter="url(#shadow)">
    <rect x="1" y="1" width="998" height="668" rx="15" fill="url(#windowBg)" stroke="#303843" stroke-width="1.5"/>
    <g clip-path="url(#windowClip)">
      <rect x="1" y="1" width="998" height="52" fill="url(#titleBar)"/>
      <path d="M1 52.5 H999" stroke="#343c47" stroke-width="1"/>

      <!-- macOS traffic lights -->
      <circle cx="25" cy="26" r="7" fill="#ff5f57" stroke="#e0443e" stroke-width="0.7"/>
      <circle cx="49" cy="26" r="7" fill="#febc2e" stroke="#d89e24" stroke-width="0.7"/>
      <circle cx="73" cy="26" r="7" fill="#28c840" stroke="#1dad32" stroke-width="0.7"/>

      <!-- Title bar -->
      <text x="500" y="31" text-anchor="middle" fill="#b7c0cb"
            font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
            font-size="13" font-weight="500" letter-spacing="0.2">saulo — zsh — 100×32</text>
      <text x="966" y="31" text-anchor="end" fill="#687382"
            font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace"
            font-size="10">⌘ K</text>

      <!-- Subtle terminal prompt marker -->
      <circle cx="32" cy="81" r="3" fill="#3fb950"/>
      <text x="45" y="85" fill="#7d8998"
            font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace"
            font-size="10.5" letter-spacing="0.7">SESSION STARTED</text>

      <!-- Code lines. The animated clipping reveals each line like terminal typing. -->
      <g font-family="SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace"
         font-size="13.2" xml:space="preserve">
        <clipPath id="line0"><rect x="0" y="96.00" width="1000" height="20">
          <animate attributeName="width" values="0;0;104.4;104.4;0;0" keyTimes="0;0.00900;0.02000;0.90;0.94;1" dur="20s" repeatCount="indefinite"/>
        </rect></clipPath>
        <text x="34" y="111.00" fill="#7ee787" clip-path="url(#line0)">$ python</text>
        <clipPath id="line1"><rect x="0" y="115.60" width="1000" height="20">
          <animate attributeName="width" values="0;0;168.8;168.8;0;0" keyTimes="0;0.02225;0.03325;0.90;0.94;1" dur="20s" repeatCount="indefinite"/>
        </rect></clipPath>
        <text x="34" y="130.60" fill="#ff7b72" clip-path="url(#line1)">&gt;&gt;&gt; class Saulo:</text>
        <clipPath id="line2"><rect x="0" y="135.20" width="1000" height="20">
          <animate attributeName="width" values="0;0;257.4;257.4;0;0" keyTimes="0;0.03550;0.04968;0.90;0.94;1" dur="20s" repeatCount="indefinite"/>
        </rect></clipPath>
        <text x="34" y="150.20" fill="#d2a8ff" clip-path="url(#line2)">...     def __init__(self):</text>
