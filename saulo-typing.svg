        </rect></clipPath>
        <text x="34" y="169.80" fill="#c9d1d9" clip-path="url(#line3)">...         self.role = &quot;Student and Researcher&quot;</text>
        <clipPath id="line4"><rect x="0" y="174.40" width="1000" height="20">
          <animate attributeName="width" values="0;0;716.4;716.4;0;0" keyTimes="0;0.06200;0.10300;0.90;0.94;1" dur="20s" repeatCount="indefinite"/>
        </rect></clipPath>
        <text x="34" y="189.40" fill="#c9d1d9" clip-path="url(#line4)">...         self.background = &quot;Mathematics, Programming, and Mechanical Engineering&quot;</text>
        <clipPath id="line5"><rect x="0" y="194.00" width="1000" height="20">
          <animate attributeName="width" values="0;0;281.6;281.6;0;0" keyTimes="0;0.07525;0.09100;0.90;0.94;1" dur="20s" repeatCount="indefinite"/>
        </rect></clipPath>
        <text x="34" y="209.00" fill="#c9d1d9" clip-path="url(#line5)">...         self.interests = [</text>
        <clipPath id="line6"><rect x="0" y="213.60" width="1000" height="20">
