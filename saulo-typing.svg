<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="svgTitle svgDesc">
  <title id="svgTitle">saulo@github — animated terminal profile</title>
  <desc id="svgDesc">A macOS-style terminal window showing Saulo's Python profile, with syntax highlighting, sequential line reveal, and a blinking cursor.</desc>
  <defs>
    <radialGradient id="backGlow" cx="50%" cy="46%" r="75%">
      <stop offset="0" stop-color="#142238"/>
      <stop offset="1" stop-color="#070b12"/>
    </radialGradient>
    <linearGradient id="windowTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b222c"/>
      <stop offset="1" stop-color="#151b24"/>
    </linearGradient>
    <linearGradient id="accentLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff" stop-opacity="0.9"/>
      <stop offset="0.55" stop-color="#a371f7" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#58a6ff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="18" result="blur"/>
      <feOffset dy="14" result="offset"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.48"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .mono { font-family: SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
      .code { font-size: 18px; font-weight: 500; fill: #c9d1d9; }
      .muted { fill: #7d8590; }
      .prompt { fill: #7ee787; font-weight: 700; }
      .keyword { fill: #ff7b72; }
      .type { fill: #d2a8ff; }
      .function { fill: #d2a8ff; }
      .self { fill: #79c0ff; }
      .string { fill: #a5d6ff; }
      .operator { fill: #ff7b72; }
      .number { fill: #79c0ff; }
      .typed { opacity: 1; }
      .cursor { animation: blink 1.05s steps(2, start) infinite; }
      .pulse { animation: pulse 2s ease-in-out infinite; }
      @keyframes blink { 0%, 48% { opacity: 1; } 49%, 100% { opacity: 0; } }
      @keyframes pulse { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) {
        .cursor, .pulse { animation: none; }
      }
    </style>
  </defs>

  <rect width="1200" height="900" fill="url(#backGlow)"/>
  <circle cx="600" cy="450" r="440" fill="#1f6feb" opacity="0.035"/>

  <g filter="url(#shadow)">
    <rect x="54" y="44" width="1092" height="812" rx="18" fill="#0d1117" stroke="#303946" stroke-width="1.5"/>
    <path d="M72 44h1056a18 18 0 0 1 18 18v39H54V62a18 18 0 0 1 18-18Z" fill="url(#windowTop)"/>
    <path d="M54 101.5H1146" stroke="#303946" stroke-width="1"/>
    <circle cx="83" cy="73" r="7" fill="#ff5f57"/>
    <circle cx="106" cy="73" r="7" fill="#febc2e"/>
    <circle cx="129" cy="73" r="7" fill="#28c840"/>
    <text x="600" y="79" class="mono" font-size="14" fill="#c9d1d9" text-anchor="middle">saulo@github — zsh</text>
    <text x="1110" y="78" class="mono" font-size="11" fill="#7d8590" text-anchor="end">120 × 36</text>
  </g>

  <g class="mono" font-size="11" letter-spacing="1.5">
    <text x="100" y="133" fill="#8b949e">~/PROJECTS/SAULO</text>
    <text x="1100" y="133" fill="#7ee787" text-anchor="end">● SESSION ACTIVE</text>
  </g>
  <rect x="100" y="143" width="1000" height="1" fill="url(#accentLine)"/>

