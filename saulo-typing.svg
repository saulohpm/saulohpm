      <clipPath id="clip6" clipPathUnits="userSpaceOnUse"><rect x="98" y="313" width="0" height="25"><animate attributeName="width" from="0" to="1000" begin="1.43s" dur="0.48s" fill="freeze"/></rect></clipPath>
      <clipPath id="clip7" clipPathUnits="userSpaceOnUse"><rect x="98" y="340" width="0" height="25"><animate attributeName="width" from="0" to="1000" begin="1.61s" dur="0.48s" fill="freeze"/></rect></clipPath>
      <clipPath id="clip8" clipPathUnits="userSpaceOnUse"><rect x="98" y="367" width="0" height="25"><animate attributeName="width" from="0" to="1000" begin="1.79s" dur="0.48s" fill="freeze"/></rect></clipPath>
