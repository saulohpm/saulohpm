    <g clip-path="url(#clip10)"><text x="100" y="440"> </text></g>
    <g clip-path="url(#clip11)"><text x="100" y="467"><tspan xml:space="preserve">        </tspan><tspan class="self">self</tspan><tspan fill="#c9d1d9">.approach = [</tspan></text></g>
    <g clip-path="url(#clip12)"><text x="100" y="494"><tspan xml:space="preserve">            </tspan><tspan class="string">"Understand the problem"</tspan><tspan fill="#c9d1d9">,</tspan></text></g>
    <g clip-path="url(#clip13)"><text x="100" y="521"><tspan xml:space="preserve">            </tspan><tspan class="string">"Build a mathematical model"</tspan><tspan fill="#c9d1d9">,</tspan></text></g>
    <g clip-path="url(#clip14)"><text x="100" y="548"><tspan xml:space="preserve">            </tspan><tspan class="string">"Develop a computational solution"</tspan><tspan fill="#c9d1d9">,</tspan></text></g>
    <g clip-path="url(#clip15)"><text x="100" y="575"><tspan xml:space="preserve">            </tspan><tspan class="string">"Analyze the results"</tspan><tspan fill="#c9d1d9">,</tspan></text></g>
    <g clip-path="url(#clip16)"><text x="100" y="602"><tspan xml:space="preserve">        </tspan><tspan fill="#c9d1d9">]</tspan></text></g>
    <g clip-path="url(#clip17)"><text x="100" y="629"> </text></g>
