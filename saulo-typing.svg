      <clipPath id="clip17" clipPathUnits="userSpaceOnUse"><rect x="98" y="610" width="0" height="25"><animate attributeName="width" from="0" to="1000" begin="3.41s" dur="0.48s" fill="freeze"/></rect></clipPath>
      <clipPath id="clip18" clipPathUnits="userSpaceOnUse"><rect x="98" y="637" width="0" height="25"><animate attributeName="width" from="0" to="1000" begin="3.59s" dur="0.48s" fill="freeze"/></rect></clipPath>
