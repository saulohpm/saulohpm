        </rect></clipPath>
        <text x="34" y="444.20" fill="#c9d1d9" clip-path="url(#line17)">...         self.stack = [&quot;Python&quot;, &quot;JavaScript&quot;, &quot;LaTeX&quot;, &quot;HTML&quot;, &quot;CSS&quot;]</text>
        <clipPath id="line18"><rect x="0" y="448.80" width="1000" height="20">
          <animate attributeName="width" values="0;0;64.2;64.2;0;0" keyTimes="0;0.24750;0.25850;0.90;0.94;1" dur="20s" repeatCount="indefinite"/>
        </rect></clipPath>
        <text x="34" y="463.80" fill="#7d8998" clip-path="url(#line18)">...</text>
        <clipPath id="line19"><rect x="0" y="468.40" width="1000" height="20">
          <animate attributeName="width" values="0;0;305.7;305.7;0;0" keyTimes="0;0.26075;0.27807;0.90;0.94;1" dur="20s" repeatCount="indefinite"/>
        </rect></clipPath>
        <text x="34" y="483.40" fill="#d2a8ff" clip-path="url(#line19)">...     def build(self, problem):</text>
        <clipPath id="line20"><rect x="0" y="488.00" width="1000" height="20">
          <animate attributeName="width" values="0;0;499.0;499.0;0;0" keyTimes="0;0.27400;0.30393;0.90;0.94;1" dur="20s" repeatCount="indefinite"/>
        </rect></clipPath>
        <text x="34" y="503.00" fill="#a5d6ff" clip-path="url(#line20)">...         return f&quot;a computational tool for: {problem}&quot;</text>
        <clipPath id="line21"><rect x="0" y="507.60" width="1000" height="20">
          <animate attributeName="width" values="0;0;40.0;40.0;0;0" keyTimes="0;0.28725;0.29825;0.90;0.94;1" dur="20s" repeatCount="indefinite"/>
        </rect></clipPath>
        <text x="34" y="522.60" fill="#c9d1d9" clip-path="url(#line21)"></text>
        <clipPath id="line22"><rect x="0" y="527.20" width="1000" height="20">
          <animate attributeName="width" values="0;0;305.7;305.7;0;0" keyTimes="0;0.30050;0.31782;0.90;0.94;1" dur="20s" repeatCount="indefinite"/>
        </rect></clipPath>
        <text x="34" y="542.20" fill="#79c0ff" clip-path="url(#line22)">&gt;&gt;&gt; Saulo().build(&quot;math problem&quot;)</text>
        <clipPath id="line23"><rect x="0" y="546.80" width="1000" height="20">
          <animate attributeName="width" values="0;0;362.1;362.1;0;0" keyTimes="0;0.31375;0.33475;0.90;0.94;1" dur="20s" repeatCount="indefinite"/>
        </rect></clipPath>
        <text x="34" y="561.80" fill="#7ee787" clip-path="url(#line23)">&#x27;a computational tool for: math problem&#x27;</text>
        <clipPath id="line24"><rect x="0" y="566.40" width="1000" height="20">
          <animate attributeName="width" values="0;0;40.0;40.0;0;0" keyTimes="0;0.32700;0.33800;0.90;0.94;1" dur="20s" repeatCount="indefinite"/>
        </rect></clipPath>
        <text x="34" y="581.40" fill="#c9d1d9" clip-path="url(#line24)"></text>
        <clipPath id="line25"><rect x="0" y="586.00" width="1000" height="20">
          <animate attributeName="width" values="0;0;507.0;507.0;0;0" keyTimes="0;0.34025;0.37070;0.90;0.94;1" dur="20s" repeatCount="indefinite"/>
        </rect></clipPath>
        <text x="34" y="601.00" fill="#79c0ff" clip-path="url(#line25)">&gt;&gt;&gt; print(&quot;Check out the repositories and projects below&quot;)</text>
        <clipPath id="line26"><rect x="0" y="605.60" width="1000" height="20">
          <animate attributeName="width" values="0;0;402.3;402.3;0;0" keyTimes="0;0.35350;0.37713;0.90;0.94;1" dur="20s" repeatCount="indefinite"/>
        </rect></clipPath>
        <text x="34" y="620.60" fill="#7ee787" clip-path="url(#line26)">Check out the repositories and projects below</text>
      </g>

      <!-- Blinking cursor at the end of the final output -->
      <rect x="405" y="608" width="8" height="15" rx="1" fill="#7ee787">
        <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1" dur="1s" repeatCount="indefinite"/>
      </rect>

      <!-- Footer hint -->
      <path d="M24 631 H976" stroke="#222b35" stroke-width="1"/>
      <text x="34" y="644" fill="#566170"
            font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace"
            font-size="9.5" letter-spacing="0.35">saulo@github  ·  python  ·  UTF-8</text>
      <text x="966" y="644" text-anchor="end" fill="#566170"
            font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace"
            font-size="9.5">READY</text>
    </g>
