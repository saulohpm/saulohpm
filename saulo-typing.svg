        </rect></clipPath>
        <text x="34" y="228.60" fill="#a5d6ff" clip-path="url(#line6)">...             &quot;mathematical modeling&quot;,</text>
        <clipPath id="line7"><rect x="0" y="233.20" width="1000" height="20">
          <animate attributeName="width" values="0;0;547.3;547.3;0;0" keyTimes="0;0.10175;0.13483;0.90;0.94;1" dur="20s" repeatCount="indefinite"/>
        </rect></clipPath>
        <text x="34" y="248.20" fill="#a5d6ff" clip-path="url(#line7)">...             &quot;numerical methods &amp; computational simulation&quot;,</text>
        <clipPath id="line8"><rect x="0" y="252.80" width="1000" height="20">
          <animate attributeName="width" values="0;0;418.4;418.4;0;0" keyTimes="0;0.11500;0.13968;0.90;0.94;1" dur="20s" repeatCount="indefinite"/>
        </rect></clipPath>
        <text x="34" y="267.80" fill="#a5d6ff" clip-path="url(#line8)">...             &quot;data analysis &amp; data science&quot;,</text>
        <clipPath id="line9"><rect x="0" y="272.40" width="1000" height="20">
          <animate attributeName="width" values="0;0;434.5;434.5;0;0" keyTimes="0;0.12825;0.15398;0.90;0.94;1" dur="20s" repeatCount="indefinite"/>
        </rect></clipPath>
        <text x="34" y="287.40" fill="#a5d6ff" clip-path="url(#line9)">...             &quot;software &amp; systems development&quot;,</text>
        <clipPath id="line10"><rect x="0" y="292.00" width="1000" height="20">
          <animate attributeName="width" values="0;0;144.7;144.7;0;0" keyTimes="0;0.14150;0.15250;0.90;0.94;1" dur="20s" repeatCount="indefinite"/>
        </rect></clipPath>
        <text x="34" y="307.00" fill="#c9d1d9" clip-path="url(#line10)">...         ]</text>
        <clipPath id="line11"><rect x="0" y="311.60" width="1000" height="20">
          <animate attributeName="width" values="0;0;281.6;281.6;0;0" keyTimes="0;0.15475;0.17050;0.90;0.94;1" dur="20s" repeatCount="indefinite"/>
        </rect></clipPath>
        <text x="34" y="326.60" fill="#c9d1d9" clip-path="url(#line11)">...         self.education = [</text>
        <clipPath id="line12"><rect x="0" y="331.20" width="1000" height="20">
          <animate attributeName="width" values="0;0;547.3;547.3;0;0" keyTimes="0;0.16800;0.20108;0.90;0.94;1" dur="20s" repeatCount="indefinite"/>
        </rect></clipPath>
        <text x="34" y="346.20" fill="#a5d6ff" clip-path="url(#line12)">...             &quot;M.Sc. (in progress) - Mechanical Engineering&quot;,</text>
        <clipPath id="line13"><rect x="0" y="350.80" width="1000" height="20">
          <animate attributeName="width" values="0;0;668.1;668.1;0;0" keyTimes="0;0.18125;0.22220;0.90;0.94;1" dur="20s" repeatCount="indefinite"/>
        </rect></clipPath>
        <text x="34" y="365.80" fill="#a5d6ff" clip-path="url(#line13)">...             &quot;Technologist (in progress) - Systems Analysis &amp; Development&quot;,</text>
        <clipPath id="line14"><rect x="0" y="370.40" width="1000" height="20">
          <animate attributeName="width" values="0;0;474.8;474.8;0;0" keyTimes="0;0.19450;0.22285;0.90;0.94;1" dur="20s" repeatCount="indefinite"/>
        </rect></clipPath>
        <text x="34" y="385.40" fill="#a5d6ff" clip-path="url(#line14)">...             &quot;Postgrad - Financial Administration&quot;,</text>
        <clipPath id="line15"><rect x="0" y="390.00" width="1000" height="20">
          <animate attributeName="width" values="0;0;346.0;346.0;0;0" keyTimes="0;0.20775;0.22770;0.90;0.94;1" dur="20s" repeatCount="indefinite"/>
        </rect></clipPath>
        <text x="34" y="405.00" fill="#a5d6ff" clip-path="url(#line15)">...             &quot;B.Ed. - Mathematics&quot;,</text>
        <clipPath id="line16"><rect x="0" y="409.60" width="1000" height="20">
          <animate attributeName="width" values="0;0;144.7;144.7;0;0" keyTimes="0;0.22100;0.23200;0.90;0.94;1" dur="20s" repeatCount="indefinite"/>
        </rect></clipPath>
        <text x="34" y="424.60" fill="#c9d1d9" clip-path="url(#line16)">...         ]</text>
        <clipPath id="line17"><rect x="0" y="429.20" width="1000" height="20">
