      <clipPath id="clip12" clipPathUnits="userSpaceOnUse"><rect x="98" y="475" width="0" height="25"><animate attributeName="width" from="0" to="1000" begin="2.51s" dur="0.48s" fill="freeze"/></rect></clipPath>
      <clipPath id="clip13" clipPathUnits="userSpaceOnUse"><rect x="98" y="502" width="0" height="25"><animate attributeName="width" from="0" to="1000" begin="2.69s" dur="0.48s" fill="freeze"/></rect></clipPath>
      <clipPath id="clip14" clipPathUnits="userSpaceOnUse"><rect x="98" y="529" width="0" height="25"><animate attributeName="width" from="0" to="1000" begin="2.87s" dur="0.48s" fill="freeze"/></rect></clipPath>
      <clipPath id="clip15" clipPathUnits="userSpaceOnUse"><rect x="98" y="556" width="0" height="25"><animate attributeName="width" from="0" to="1000" begin="3.05s" dur="0.48s" fill="freeze"/></rect></clipPath>
