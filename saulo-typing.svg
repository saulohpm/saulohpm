      <clipPath id="clip21" clipPathUnits="userSpaceOnUse"><rect x="98" y="718" width="0" height="25"><animate attributeName="width" from="0" to="1000" begin="4.13s" dur="0.48s" fill="freeze"/></rect></clipPath>
      <clipPath id="clip22" clipPathUnits="userSpaceOnUse"><rect x="98" y="745" width="0" height="25"><animate attributeName="width" from="0" to="1000" begin="4.31s" dur="0.48s" fill="freeze"/></rect></clipPath>
      <clipPath id="clip23" clipPathUnits="userSpaceOnUse"><rect x="98" y="772" width="0" height="25"><animate attributeName="width" from="0" to="1000" begin="4.49s" dur="0.48s" fill="freeze"/></rect></clipPath>
    </defs>

    <g clip-path="url(#clip0)"><text x="100" y="170"><tspan class="prompt">saulo@github</tspan><tspan fill="#8b949e">:~ % </tspan><tspan fill="#f0f6fc">cat profile.py</tspan></text></g>
    <g clip-path="url(#clip1)"><text x="100" y="197"><tspan class="keyword">class </tspan><tspan class="type">Saulo</tspan><tspan fill="#c9d1d9">:</tspan></text></g>
    <g clip-path="url(#clip2)"><text x="100" y="224"><tspan xml:space="preserve">    </tspan><tspan class="keyword">def </tspan><tspan class="function">__init__</tspan><tspan fill="#c9d1d9">(</tspan><tspan class="self">self</tspan><tspan fill="#c9d1d9">):</tspan></text></g>
    <g clip-path="url(#clip3)"><text x="100" y="251"><tspan xml:space="preserve">        </tspan><tspan class="self">self</tspan><tspan fill="#c9d1d9">.identity = </tspan><tspan class="string">"Student | Researcher | Developer"</tspan></text></g>
    <g clip-path="url(#clip4)"><text x="100" y="278"> </text></g>
    <g clip-path="url(#clip5)"><text x="100" y="305"><tspan xml:space="preserve">        </tspan><tspan class="self">self</tspan><tspan fill="#c9d1d9">.fields = [</tspan></text></g>
